name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build (for example v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Check out the app
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Select release version
        id: version
        env:
          REF_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          case "$REF_NAME" in
            v[0-9]*) echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT" ;;
            *) echo "Expected a v-prefixed release tag, got: $REF_NAME" >&2; exit 1 ;;
          esac
          echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Test
        run: make test

      - name: Build unsigned release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make VERSION="$VERSION" package

      - name: Verify release archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make VERSION="$VERSION" verify-release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            "dist/instant-translate-enhanced-v${VERSION}-darwin-arm64.zip" \
            --title "Instant Translate Enhanced ${VERSION}" \
            --generate-notes

      - name: Check out Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: anonymousaga/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew tap
        env:
          BREW_TAP_DIR: ${{ github.workspace }}/homebrew-tap
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git -C "$BREW_TAP_DIR" config user.name "github-actions[bot]"
          git -C "$BREW_TAP_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          make VERSION="$VERSION" BREW_TAP_DIR="$BREW_TAP_DIR" brew
